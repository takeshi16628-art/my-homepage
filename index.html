
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>レイプの神様｜公式ホームページ</title>

  <style>
    /* ページ全体 */
    body {
      margin: 0;
      font-family: "Yu Gothic", "Meiryo", sans-serif;
      background: #f3f5f8;
      color: #222;
      line-height: 1.8;
    }

    /* ヘッダー */
    header {
      background: white;
      border-bottom: 4px solid #17365d;
      padding: 25px 5%;
      display: flex;
      align-items: center;
      gap: 25px;
    }

    .header-title {
      flex: 1;
    }

    header h1 {
      margin: 0;
      color: #17365d;
      font-size: 30px;
    }

    header p {
      margin: 5px 0 0;
      color: #555;
      font-size: 15px;
    }

    /* タイトル横のアイコン */
    .site-icon {
      width: 90px;
      height: 90px;
      object-fit: contain;
      flex-shrink: 0;
    }

    /* ナビゲーション */
    nav {
      background: #17365d;
      padding: 12px 5%;
      display: flex;
      gap: 30px;
      flex-wrap: wrap;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    nav a:hover {
      text-decoration: underline;
    }

    /* メインコンテンツ */
    main {
      max-width: 1000px;
      margin: 35px auto;
      padding: 0 20px;
    }

    section {
      background: white;
      padding: 25px 30px;
      margin-bottom: 25px;
      border: 1px solid #ddd;
      border-radius: 5px;
    }

    section h2 {
      color: #17365d;
      border-left: 5px solid #17365d;
      padding-left: 12px;
      margin-top: 0;
    }

    /* お知らせ */
    .news-item {
      border-bottom: 1px solid #ddd;
      padding: 12px 0;
    }

    .news-item:last-child {
      border-bottom: none;
    }

    .date {
      color: #666;
      margin-right: 15px;
      font-size: 14px;
    }

    /* フッター */
    footer {
      background: #17365d;
      color: white;
      text-align: center;
      padding: 25px;
      font-size: 13px;
    }

    /* スマートフォン対応 */
    @media (max-width: 600px) {
      header {
        padding: 20px;
        gap: 12px;
      }

      header h1 {
        font-size: 22px;
      }

      header p {
        font-size: 12px;
      }

      .site-icon {
        width: 65px;
        height: 65px;
      }

      nav {
        gap: 15px;
      }

      section {
        padding: 20px;
      }
    }
  </style>
</head>

<body>

  <!-- ヘッダー -->
  <header>
    <div class="header-title">
      <h1>レイプの神様</h1>
      <p>— この世界に、少しの面白さを —</p>
    </div>

    <img
      src="images/icon.JPG"
      alt="サイトアイコン"
      class="site-icon"
    >
  </header>

  <!-- ナビゲーション -->
  <nav>
    <a href="#home">ホーム</a>
    <a href="#news">お知らせ</a>
    <a href="#about">当サイトについて</a>
    <a href="#profile">プロフィール</a>
  </nav>

  <!-- メイン -->
  <main>

    <section id="home">
      <h2>ホーム</h2>
      <p>
        公式ホームページへようこそ。
        当サイトでは、お知らせや活動情報などを掲載しています。
      </p>
    </section>

    <section id="news">
      <h2>お知らせ</h2>

      <div class="news-item">
        <span class="date">2026年11月12日</span>
        <span>ホームページを更新しました。</span>
      </div>

    </section>

    <section id="about">
      <h2>当サイトについて</h2>
      <p>
        このサイトは、個人で運営しているホームページです。
        サイトに関する情報や活動内容を掲載しています。
      </p>
    </section>

    <section id="profile">
      <h2>プロフィール</h2>
      <p>運営者：非公開</p>
      <p>所在地：非公開</p>
    </section>

  </main>

  <!-- フッター -->
  <footer>
    <p>&copy; 2026 公式ホームページ</p>
  </footer>

</body>
</html>
